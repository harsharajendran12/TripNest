spring.application.name=tripnest-backend
server.port=8080

spring.datasource.url=${DATABASE_URL:jdbc:mysql://localhost:3306/tripnest_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DATABASE_USERNAME:root}
spring.datasource.password=${DATABASE_PASSWORD:madhav@497}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

app.cors.allowed-origin=${FRONTEND_URL:http://localhost:5173}

app.jwt.secret=${JWT_SECRET:TripNestDevelopmentSecretKeyChangeThisToARealSecretAtLeast32Characters}
app.jwt.expiration-ms=86400000

management.endpoints.web.exposure.include=health,info
