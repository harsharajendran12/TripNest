spring.application.name=tripnest-backend
server.port=8080

spring.datasource.url=jdbc:postgresql://localhost:5432/tripnest_db
spring.datasource.username=postgres
spring.datasource.password=root@123
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false
app.cors.allowed-origin=${FRONTEND_URL:http://localhost:5173}

app.jwt.secret=${JWT_SECRET:TripNestDevelopmentSecretKeyChangeThisToARealSecretAtLeast32Characters}
app.jwt.expiration-ms=86400000

management.endpoints.web.exposure.include=health,info


spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=openid,profile,email
